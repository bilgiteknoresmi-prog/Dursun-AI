
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dursun AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eeeeee;
    color: #111;
    overflow: hidden;
}

.header {
    height: 66px;
    background: #999999;
    border: 2px solid #111;
    display: flex;
    align-items: center;
    padding: 0 10px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    color: #dedede;
    letter-spacing: -1px;
}

.container {
    display: flex;
    height: calc(100vh - 66px);
}

.sidebar {
    width: 145px;
    min-width: 145px;
    background: #aaaaaa;
    border-right: 4px solid black;
}

.menu-button {
    width: 100%;
    min-height: 40px;
    padding: 8px 4px;
    border: none;
    border-bottom: 3px solid black;
    background: #eeeeee;
    font-size: 18px;
    font-weight: bold;
    white-space: nowrap;
    cursor: pointer;
}

.menu-button:hover {
    background: #d5d5d5;
}

.main {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.page {
    display: none;
    height: 100%;
    flex-direction: column;
}

.page.active {
    display: flex;
}

.welcome {
    text-align: center;
    color: #b0b0b0;
    font-size: 29px;
    font-weight: bold;
    margin-top: 32px;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    max-width: 80%;
    padding: 13px 16px;
    border-radius: 13px;
    font-size: 16px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user-message {
    background: #c9c9c9;
    align-self: flex-end;
    border: 1px solid #999;
}

.ai-message {
    background: #ffffff;
    align-self: flex-start;
    border: 1px solid #cccccc;
}

.message.error {
    color: #a00000;
}

.input-area {
    padding: 8px;
}

.message-input {
    width: 100%;
    height: 48px;
    border: 4px solid #b0b0b0;
    border-radius: 25px;
    background: #f8f8f8;
    outline: none;
    padding: 0 18px;
    font-size: 16px;
}

.message-input:focus {
    border-color: #777;
}

.send-button {
    display: none;
}

.settings-content {
    padding: 25px;
    overflow-y: auto;
}

.settings-content h2 {
    margin-top: 0;
    color: #777;
}

.setting-label {
    display: block;
    font-size: 17px;
    font-weight: bold;
    margin: 20px 0 8px;
}

.api-input, .model-input {
    width: 100%;
    height: 43px;
    padding: 10px;
    border: 2px solid #aaa;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}

.save-button, .new-chat-button {
    margin-top: 15px;
    background: #999;
    border: 2px solid #555;
    padding: 11px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
}

.save-button:hover, .new-chat-button:hover {
    background: #bbb;
}

.status {
    margin-top: 12px;
    font-size: 14px;
    color: #555;
}

.info {
    margin-top: 25px;
    color: #777;
    font-size: 13px;
    line-height: 1.5;
}

@media(max-width: 500px) {
    .sidebar {
        width: 125px;
        min-width: 125px;
    }

    .menu-button {
        font-size: 16px;
    }

    .logo {
        font-size: 25px;
    }

    .welcome {
        font-size: 23px;
    }

    .settings-content {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">☼ Dursun AI</div>
</header>

<div class="container">

    <aside class="sidebar">
        <button class="menu-button" onclick="showPage('home')">
            Ana Menü
        </button>

        <button class="menu-button" onclick="showPage('settings')">
            Ayarlar
        </button>
    </aside>

    <main class="main">

        <section id="home" class="page active">

            <div id="welcome" class="welcome">
                Başlamaya Hazırım
            </div>

            <div id="messages" class="chat-messages"></div>

            <div class="input-area">
                <input
                    id="messageInput"
                    class="message-input"
                    type="text"
                    placeholder="Bir şeyler sor..."
                    autocomplete="off"
                >
            </div>

        </section>

        <section id="settings" class="page">

            <div class="settings-content">

                <h2>Ayarlar</h2>

                <label class="setting-label">
                    Google AI Studio API Key
                </label>

                <input
                    id="apiKey"
                    class="api-input"
                    type="password"
                    placeholder="API Key'ini buraya gir..."
                >

                <button onclick="toggleKey()" class="save-button">
                    Anahtarı Göster / Gizle
                </button>

                <label class="setting-label">
                    Gemini Modeli
                </label>

                <input
                    id="modelName"
                    class="model-input"
                    type="text"
                    value="gemini-2.5-flash"
                    placeholder="Gemini model adı"
                >

                <br>

                <button class="save-button" onclick="saveSettings()">
                    Kaydet
                </button>

                <div id="status" class="status"></div>

                <div class="info">
                    Dursun AI, Google Gemini API kullanır.
                    <br><br>
                    API Key bilgisini kimseyle paylaşma.
                    Bu sürüm anahtarı bu tarayıcının yerel
                    depolamasında saklar.
                </div>

                <button class="new-chat-button" onclick="newChat()">
                    + Yeni Sohbet
                </button>

            </div>

        </section>

    </main>

</div>

<script>

const apiKeyInput = document.getElementById("apiKey");
const modelInput = document.getElementById("modelName");

apiKeyInput.value = localStorage.getItem("dursun_api_key") || "";
modelInput.value = localStorage.getItem("dursun_model") || "gemini-2.5-flash";

let conversation = [];
let isSending = false;

function showPage(page) {
    document.querySelectorAll(".page").forEach(p => {
        p.classList.remove("active");
    });

    document.getElementById(page).classList.add("active");
}

function toggleKey() {
    apiKeyInput.type =
        apiKeyInput.type === "password" ? "text" : "password";
}

function saveSettings() {
    const key = apiKeyInput.value.trim();
    const model = modelInput.value.trim();

    if (!key) {
        document.getElementById("status").textContent =
            "Lütfen API Key gir.";
        return;
    }

    if (!model) {
        document.getElementById("status").textContent =
            "Lütfen model adını gir.";
        return;
    }

    localStorage.setItem("dursun_api_key", key);
    localStorage.setItem("dursun_model", model);

    document.getElementById("status").textContent =
        "Ayarlar başarıyla kaydedildi!";
}

function addMessage(text, type) {
    const messages = document.getElementById("messages");
    const message = document.createElement("div");

    message.className = "message " + type;
    message.textContent = text;

    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;

    document.getElementById("welcome").style.display = "none";

    return message;
}

function newChat() {
    conversation = [];

    document.getElementById("messages").innerHTML = "";
    document.getElementById("welcome").style.display = "block";
    document.getElementById("welcome").textContent =
        "Başlamaya Hazırım";

    showPage("home");
}

async function sendMessage() {
    if (isSending) return;

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text) return;

    const apiKey = localStorage.getItem("dursun_api_key");
    const model = localStorage.getItem("dursun_model") ||
                  "gemini-2.5-flash";

    if (!apiKey) {
        addMessage(
            "Önce Ayarlar bölümünden API Key girmelisin.",
            "ai-message error"
        );
        return;
    }

    input.value = "";

    addMessage(text, "user-message");

    conversation.push({
        role: "user",
        parts: [{ text: text }]
    });

    isSending = true;

    const typing = addMessage(
        "Dursun AI düşünüyor...",
        "ai-message"
    );

    try {
        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": apiKey
                },
                body: JSON.stringify({
                    contents: conversation
                })
            }
        );

        const data = await response.json();
        typing.remove();

        if (!response.ok) {
            addMessage(
                "API Hatası: " +
                (data.error?.message || "Bilinmeyen hata."),
                "ai-message error"
            );

            conversation.pop();
            return;
        }

        const answer = data.candidates?.[0]?.content?.parts
            ?.map(part => part.text || "")
            .join("");

        if (!answer) {
            addMessage(
                "Gemini boş bir cevap döndürdü.",
                "ai-message error"
            );

            conversation.pop();
            return;
        }

        conversation.push({
            role: "model",
            parts: [{ text: answer }]
        });

        addMessage(answer, "ai-message");

    } catch (error) {
        typing.remove();

        addMessage(
            "Bağlantı hatası: " + error.message,
            "ai-message error"
        );

        conversation.pop();

    } finally {
        isSending = false;
        input.focus();
    }
}

document.getElementById("messageInput")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    });

</script>

</body>
</html>
